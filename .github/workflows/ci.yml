name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Testes
        run: npm test
      - name: Demo (criar o agente no exemplo e conversar)
        run: |
          npm run demo
          node bin/agent-generator.js conversar .demo/cafe-aurora "oi" "quero um café até 50 reais"

  # Gera o executável de verdade em cada sistema e roda ele dentro de uma cópia do site de exemplo,
  # do jeito que a pessoa usaria: o arquivo na pasta raiz do projeto, sem argumentos.
  executavel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gerar o executável
        run: node scripts/build-exe.js
      - name: Rodar o executável na pasta raiz de um site
        shell: bash
        run: |
          SITE="$RUNNER_TEMP/site com espaço"
          mkdir -p "$SITE"
          cp -R examples/loja-exemplo/. "$SITE/"
          rm -rf "$SITE/agente" "$SITE/agente-gerador"
          case "$RUNNER_OS" in Windows) EXE=agente-gerador-windows.exe ;; macOS) EXE=agente-gerador-macos ;; *) EXE=agente-gerador-linux ;; esac
          cp "dist/$EXE" "$SITE/"
          cd "$SITE"
          "./$EXE" --sim --sem-pausa > saida.txt 2>&1 || { cat saida.txt; exit 1; }
          cat saida.txt
          test -f agente/conhecimento/faq.json
          test -f agente-gerador/backup/html/index.html
          grep -q "agente: agent-generator" index.html
          grep -q "Acerto da base" agente-gerador/RESUMO.txt
          "./$EXE" conversar . "oi" "qual o horario" > conversa.txt 2>&1 || { cat conversa.txt; exit 1; }
          cat conversa.txt
          grep -q "Café Aurora" conversa.txt
          "./$EXE" ajuda > ajuda.txt
          grep -q "assistente" ajuda.txt
          # Parte 2: o mesmo binário com "treinador" no nome abre o modo treino.
          TRAINER="${EXE/agente-gerador/agente-treinador}"
          cp "$GITHUB_WORKSPACE/dist/$TRAINER" .
          "./$TRAINER" --sem-navegador --minutos 2 --sem-pausa > treino.txt 2>&1 &
          PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4710/__agente-gerador/gravador.js > /dev/null && break; sleep 1; done
          # Arquivo em vez de "curl | grep -q": com pipefail, o grep fechando cedo derruba o curl.
          curl -sf http://127.0.0.1:4710/ > pagina-treino.html
          grep -q "__agente-gerador/treino.js" pagina-treino.html
          curl -sf -X POST http://127.0.0.1:4710/__agente-gerador/fim
          wait $PID || { cat treino.txt; exit 1; }
          cat treino.txt
          grep -q "Treino do agente" agente-gerador/TREINO.txt
      - name: Instalador visual (0.9) pelo executável
        shell: bash
        run: |
          SITE="$RUNNER_TEMP/site do instalador"
          mkdir -p "$SITE"
          cp -R examples/loja-exemplo/. "$SITE/"
          rm -rf "$SITE/agente" "$SITE/agente-gerador"
          case "$RUNNER_OS" in Windows) EXE=agente-gerador-windows.exe ;; macOS) EXE=agente-gerador-macos ;; *) EXE=agente-gerador-linux ;; esac
          cp "dist/$EXE" "$SITE/"
          ( cd "$SITE" && "./$EXE" instalador . --sem-navegador --porta 4790 > instalador.txt 2>&1 ) &
          PID=$!
          node scripts/smoke-instalador.mjs "$SITE/instalador.txt"
          wait $PID || { cat "$SITE/instalador.txt"; exit 1; }
          cat "$SITE/instalador.txt"
          grep -q '"catalogo": false' "$SITE/agente/conhecimento/agente.json"
          grep -q "Assistente CI" "$SITE/agente/conhecimento/agente.json"
          grep -q "agente: agent-generator" "$SITE/index.html"
          # O instalador para duplo clique existe; no Windows ele é programa de janela (sem terminal).
          ls dist/agente-instalador-*
          if [ "$RUNNER_OS" = "Windows" ]; then
            node -e "const b=require('fs').readFileSync('dist/agente-instalador-windows.exe');const o=b.readUInt32LE(0x3c)+24+68;const s=b.readUInt16LE(o);console.log('subsistema',s);if(s!==2)process.exit(1)"
            node -e "const b=require('fs').readFileSync('dist/agente-gerador-windows.exe');const o=b.readUInt32LE(0x3c)+24+68;const s=b.readUInt16LE(o);console.log('subsistema gerador',s);if(s!==3)process.exit(1)"
          fi
      - name: Diagnóstico (só em caso de falha)
        if: failure()
        shell: bash
        run: |
          SITE="$RUNNER_TEMP/site com espaço"
          ls -la "$SITE" dist || true
          diag=$( { cat "$SITE/saida.txt" "$SITE/conversa.txt" "$SITE/ajuda.txt"; ls -la "$SITE"; echo "--- treino ---"; cat "$SITE/treino.txt"; } 2>&1 | tail -c 5000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=diagnostico::$diag"
