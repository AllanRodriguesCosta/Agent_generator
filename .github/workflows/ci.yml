name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Testes
        run: npm test
      - name: Demo (criar o agente no exemplo e conversar)
        run: |
          npm run demo
          node bin/agent-generator.js conversar .demo/cafe-aurora "oi" "quero um café até 50 reais"
