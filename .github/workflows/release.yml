name: Publicar executáveis

# Cria uma versão (Release) com os executáveis para Windows, Linux e macOS.
# Dispara com uma tag v* (ex.: v0.2.0) ou manualmente em Actions > "Publicar executáveis" > Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão a publicar (ex.: v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: agente-gerador-windows.exe
          - os: ubuntu-latest
            name: agente-gerador-linux
          - os: macos-latest
            name: agente-gerador-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm test
      - run: node scripts/build-exe.js
      - name: Renomear para o sistema
        shell: bash
        run: |
          mkdir -p saida
          cp "dist/${{ matrix.name }}" "saida/"
          cp "dist/${{ matrix.name }}" "saida/$(echo '${{ matrix.name }}' | sed 's/agente-gerador/agente-treinador/')"
          cp dist/agente-instalador-* saida/
          cp lancadores/agente-gerador.cmd lancadores/agente-gerador.sh saida/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: saida/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la arquivos
          gh release create "$TAG" arquivos/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Agent Generator $TAG" \
            --notes "Novo na 0.11: sem código. O agente-instalador agora tem o caminho Meu site já está no ar (WordPress, Wix, Shopify ou qualquer plataforma): só o endereço, sem baixar o código e sem novo deploy. Ele lê as páginas públicas, publica o agente num serviço seu, gratuito, na Cloudflare e você cola uma linha no site (ou envia o plugin WordPress pronto), com prévia e verificação. A chave da IA é conectada no próprio instalador: OpenRouter em 1 clique (abre o login no navegador e a chave volta sozinha) ou Gemini (copiar e colar, com teste na hora); a chave fica como segredo no serviço, sem variável no Render ou Action no GitHub (docs/SEM-CODIGO.md). Para instalar: baixe o agente-instalador do seu sistema e dê dois cliques (docs/INSTALADOR.md). Parte 1: agente-gerador (terminal). Parte 2: agente-treinador (modo treino). Detalhes: docs/EXECUTAVEL.md."
