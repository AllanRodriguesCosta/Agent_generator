<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Generator — Instalador</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="lado">
        <div class="marca">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a7 7 0 0 1 7 7v1.2a3 3 0 0 1 2 2.8v2a3 3 0 0 1-3 3h-.6A7 7 0 0 1 12 22a7 7 0 0 1-5.4-4H6a3 3 0 0 1-3-3v-2a3 3 0 0 1 2-2.8V9a7 7 0 0 1 7-7Zm-3 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
          </div>
          <div>
            <strong>Agent Generator</strong>
            <span id="versao">Instalador</span>
          </div>
        </div>
        <ol id="etapas" class="etapas"></ol>
        <p class="lado-rodape">Tudo roda no seu computador. Nada do projeto é enviado para a internet.</p>
      </aside>
      <main class="principal">
        <header class="topo">
          <p class="etapa-num" id="etapaNum"></p>
          <h1 id="titulo">Carregando…</h1>
          <p id="subtitulo" class="sub"></p>
        </header>
        <div class="corpo">
          <section class="instrucoes" id="instrucoes" aria-label="O que fazer nesta etapa"></section>
          <section class="conteudo" id="conteudo"></section>
        </div>
        <footer class="rodape">
          <span id="status" class="status" role="status" aria-live="polite"></span>
          <div class="botoes">
            <button id="voltar" class="btn sec" type="button">Voltar</button>
            <button id="proximo" class="btn pri" type="button">Próximo</button>
          </div>
        </footer>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
