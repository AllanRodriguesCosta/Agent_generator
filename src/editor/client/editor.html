<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>Editor da base do agente</title>
<style>
  :root { --cor: #6d28d9; --linha: #e5e7eb; --fundo: #f8fafc; --texto: #111827; --suave: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--texto); background: var(--fundo); }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--linha); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  button { font: inherit; border: 1px solid var(--cor); background: #fff; color: var(--cor); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.principal { background: var(--cor); color: #fff; }
  button.perigo { border-color: #b91c1c; color: #b91c1c; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 1px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  nav[role=tablist] { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  nav button[aria-selected=true] { background: var(--cor); color: #fff; }
  .cartao { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .cartao header { all: unset; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .cartao header strong { flex: 1; }
  label { display: block; font-weight: 600; font-size: 12px; color: var(--suave); margin-top: 6px; }
  input, textarea, select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: var(--texto); }
  textarea { min-height: 60px; resize: vertical; }
  .linha { display: grid; grid-template-columns: 1fr 2fr auto; gap: 6px; align-items: end; }
  aside .cartao { position: sticky; top: 72px; }
  #conversa { height: 280px; overflow: auto; border: 1px solid var(--linha); border-radius: 8px; padding: 8px; background: var(--fundo); }
  .msg { margin: 0 0 8px; padding: 6px 9px; border-radius: 10px; max-width: 92%; white-space: pre-line; }
  .msg.voce { background: #ede9fe; margin-left: auto; }
  .msg.bot { background: #fff; border: 1px solid var(--linha); }
  .msg small { display: block; color: var(--suave); font-size: 11px; }
  #acerto { font-size: 28px; font-weight: 700; }
  .status { min-height: 1.4em; color: var(--suave); }
  .vazio { color: var(--suave); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header><h1>Editor da base do agente</h1><span class="status" id="status" role="status" aria-live="polite"></span><button type="button" id="avaliar">Avaliar</button><button type="button" class="principal" id="salvar">Salvar</button></header>
<main>
  <section aria-label="Base de conhecimento">
    <nav role="tablist" aria-label="Partes da base" id="abas"></nav>
    <div id="painel" role="tabpanel"></div>
  </section>
  <aside>
    <div class="cartao">
      <strong>Testar o rascunho</strong>
      <p class="vazio">O agente responde com o que está na tela, antes de salvar.</p>
      <div id="conversa" role="log" aria-live="polite"></div>
      <form id="perguntar"><label for="frase">Pergunta</label><input id="frase" maxlength="500" autocomplete="off" placeholder="Ex.: qual o horário?"><button type="submit" style="margin-top:6px">Perguntar</button></form>
      <hr>
      <strong>Acerto da base</strong>
      <div id="acerto">-</div>
      <div id="erros"></div>
    </div>
  </aside>
</main>
<script src="/editor.js"></script>
</body>
</html>
